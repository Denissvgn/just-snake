name: Pages
on:
  push:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish candidate or restore verified known-good artifact
        type: choice
        options: [publish, rollback]
        default: publish
      predecessor_id:
        description: Retained qualified artifact ID for authorized rollback
        type: string
      predecessor_record_id:
        description: Successful live verification record artifact ID
        type: string
      publish_ref:
        description: Exact discovered default branch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  qualification:
    if: inputs.operation != 'rollback' && (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' && inputs.publish_ref == github.event.repository.default_branch && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: ./.github/workflows/ci.yml
    permissions: {contents: read}
  deploy:
    needs: qualification
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && endsWith(github.repository, '/just-snake')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions: {contents: read, pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env: {PLAYWRIGHT_BROWSERS_PATH: .tools/playwright, PUPPETEER_SKIP_DOWNLOAD: 'true'}
    outputs:
      manifest_id: ${{ steps.live_manifest.outputs.artifact-id }}
      manifest_digest: ${{ steps.live_manifest.outputs.artifact-digest }}
      page_url: ${{ steps.deployment.outputs.page_url }}
      qualified_id: ${{ steps.qualified.outputs.artifact-id }}
      qualified_digest: ${{ steps.qualified.outputs.artifact-digest }}
      retention_days: ${{ steps.retention.outputs.days }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: '${{ needs.qualification.outputs.candidate_id }}', path: .artifacts/download, skip-decompress: true, digest-mismatch: error}
      - run: npm run qualify -- --phase unpack --candidate .artifacts/download/candidate.tgz --output .artifacts/candidate
      - run: npm run qualify -- --phase finalize --candidate .artifacts/candidate --attestation .github/release-attestation.json
      - id: retention
        run: node -e "const fs=require('node:fs');const n=Number(process.env.GITHUB_RETENTION_DAYS);if(!Number.isSafeInteger(n)||n<1)process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,'days='+Math.min(30,n)+'\n')"
      - run: node scripts/retain-qualified-artifact.mjs .artifacts/candidate .artifacts/qualified.tgz "$GITHUB_RETENTION_DAYS"
      - id: qualified
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {path: .artifacts/qualified.tgz, archive: false, if-no-files-found: error, retention-days: '${{ steps.retention.outputs.days }}'}
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with: {enablement: false}
      - run: npm run qualify -- --phase check --candidate .artifacts/candidate
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with: {path: .artifacts/candidate/dist}
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - run: cp .artifacts/candidate/candidate.json .artifacts/live-candidate.json
      - id: live_manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {path: .artifacts/live-candidate.json, archive: false, if-no-files-found: error}

  rollback:
    if: github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && inputs.publish_ref == github.event.repository.default_branch && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && endsWith(github.repository, '/just-snake')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions: {contents: read, actions: read, pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env: {PLAYWRIGHT_BROWSERS_PATH: .tools/playwright}
    outputs:
      manifest_id: ${{ steps.live_manifest.outputs.artifact-id }}
      manifest_digest: ${{ steps.live_manifest.outputs.artifact-digest }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - id: selection
        run: node scripts/rollback.mjs --resolve "$REPOSITORY" "$ARTIFACT_ID" "$RECORD_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.predecessor_id }}
          RECORD_ID: ${{ inputs.predecessor_record_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: '${{ inputs.predecessor_id }}', path: .artifacts/prior, run-id: '${{ steps.selection.outputs.run_id }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', skip-decompress: true, digest-mismatch: error}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: '${{ inputs.predecessor_record_id }}', path: .artifacts/prior, run-id: '${{ steps.selection.outputs.run_id }}', github-token: '${{ github.token }}', repository: '${{ github.repository }}', skip-decompress: true, digest-mismatch: error}
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with: {enablement: false}
      - run: node scripts/rollback.mjs .artifacts/prior/qualified.tgz .artifacts/prior/known-good.json .artifacts/rollback "$REPOSITORY" "$TARGET" "$ARTIFACT_ID" "$RECORD_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ steps.pages.outputs.base_url }}/
          ARTIFACT_ID: ${{ inputs.predecessor_id }}
          RECORD_ID: ${{ inputs.predecessor_record_id }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with: {path: .artifacts/rollback/dist}
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - run: cp .artifacts/rollback/candidate.json .artifacts/live-candidate.json
      - id: live_manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {path: .artifacts/live-candidate.json, archive: false, if-no-files-found: error}
  verify_live:
    needs: [deploy, rollback]
    if: always() && (needs.deploy.result == 'success' || needs.rollback.result == 'success') && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && endsWith(github.repository, '/just-snake')
    runs-on: macos-15
    timeout-minutes: 20
    permissions: {contents: read}
    environment:
      name: github-pages
      url: ${{ steps.selection.outputs.page_url }}
    env: {PLAYWRIGHT_BROWSERS_PATH: .tools/playwright, PUPPETEER_SKIP_DOWNLOAD: 'true'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - id: selection
        run: node scripts/live-verification-input.mjs select
        env: {LIVE_PRODUCERS: '${{ toJSON(needs) }}'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: '${{ steps.selection.outputs.manifest_id }}', path: .artifacts/live-input, skip-decompress: true, digest-mismatch: error}
      - run: node scripts/live-verification-input.mjs verify .artifacts/live-input/live-candidate.json "$MANIFEST_DIGEST"
        env: {MANIFEST_DIGEST: '${{ steps.selection.outputs.manifest_digest }}'}
      - run: npx playwright install --with-deps chromium
      - run: |
          if [ "$LIVE_MODE" = deploy ]; then
            npm run verify:live -- "$LIVE_URL" .artifacts/live-input/live-candidate.json --record .artifacts/known-good.json
          elif [ "$LIVE_MODE" = rollback ]; then
            npm run verify:live -- "$LIVE_URL" .artifacts/live-input/live-candidate.json
          else
            echo 'Invalid Pages producer selection' >&2
            exit 1
          fi
        env:
          TEST_ARTIFACTS: .artifacts/live-verification
          LIVE_MODE: ${{ steps.selection.outputs.mode }}
          LIVE_URL: ${{ steps.selection.outputs.page_url }}
          QUALIFIED_ARTIFACT_ID: ${{ steps.selection.outputs.qualified_id }}
          QUALIFIED_ARTIFACT_DIGEST: ${{ steps.selection.outputs.qualified_digest }}
          REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: live-verification-diagnostics, path: .artifacts/live-verification, if-no-files-found: error}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.selection.outputs.mode == 'deploy'
        with: {path: .artifacts/known-good.json, archive: false, if-no-files-found: error, retention-days: '${{ steps.selection.outputs.retention_days }}'}
