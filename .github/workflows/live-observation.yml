name: isolated-live-guarded-control
on:
  push:
    branches: [task/live-verifier-observation]
permissions: {contents: read, actions: read}
concurrency: {group: isolated-live-observation, cancel-in-progress: false}
jobs:
  observe:
    if: github.ref == 'refs/heads/task/live-verifier-observation'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env: {PLAYWRIGHT_BROWSERS_PATH: .tools/playwright, PUPPETEER_SKIP_DOWNLOAD: 'true'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: node -e "if(process.arch!=='arm64'||process.platform!=='linux')process.exit(1)"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: '11670698650', run-id: '38049981997', repository: '${{ github.repository }}', github-token: '${{ github.token }}', path: .artifacts/live-download, skip-decompress: true, digest-mismatch: error}
      - run: node scripts/observe-live-once.mjs --archive .artifacts/live-download/qualified.tgz --output .artifacts/live-observation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: isolated-live-guarded-control, path: .artifacts/live-observation, if-no-files-found: error}
