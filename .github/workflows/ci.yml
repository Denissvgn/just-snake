name: required-checks
on:
  pull_request:
  push:
  workflow_call:
    outputs:
      candidate_id:
        value: ${{ jobs.assemble.outputs.candidate_id }}
      candidate_digest:
        value: ${{ jobs.assemble.outputs.candidate_digest }}
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PLAYWRIGHT_BROWSERS_PATH: .tools/playwright
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      build_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: node -e "if(process.arch!=='arm64'||process.platform!=='linux')process.exit(1)"
      - run: npm ci && npm ci --prefix tests
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check:workflows
      - run: npm run qualify -- --phase prepare --output .artifacts/candidate
      - run: npm run qualify -- --phase test --candidate .artifacts/candidate --group infrastructure --output .artifacts/reports/infrastructure
      - run: npm run qualify -- --phase test --candidate .artifacts/candidate --group static --output .artifacts/reports/static
      - run: npm run qualify -- --phase pack --candidate .artifacts/candidate --output .artifacts/build.tgz
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {path: .artifacts/build.tgz, archive: false, if-no-files-found: error}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: reports-build, path: .artifacts/reports, if-no-files-found: error}
  legacy:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: node -e "if(process.arch!=='arm64'||process.platform!=='linux')process.exit(1)"
      - run: npm ci && npm ci --prefix tests
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: '${{ needs.build.outputs.build_id }}', path: .artifacts/download, skip-decompress: true, digest-mismatch: error}
      - run: npm run qualify -- --phase unpack --candidate .artifacts/download/build.tgz --output .artifacts/candidate
      - run: npm run qualify -- --phase test --candidate .artifacts/candidate --group legacy --output .artifacts/reports/legacy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: reports-legacy, path: .artifacts/reports/legacy, if-no-files-found: error}
  browsers:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {os: ubuntu-24.04-arm, platform: linux, engines: chromium, install: chromium, name: linux}
          - {os: macos-15, platform: darwin, engines: 'firefox,webkit', install: 'firefox webkit', name: mac}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: node -e "if(process.arch!=='arm64'||process.platform!==process.env.EXPECTED_PLATFORM)process.exit(1)"
        env: {EXPECTED_PLATFORM: '${{ matrix.platform }}'}
      - run: npm ci && npm ci --prefix tests
      - run: npx playwright install --with-deps ${{ matrix.install }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: '${{ needs.build.outputs.build_id }}', path: .artifacts/download, skip-decompress: true, digest-mismatch: error}
      - run: npm run qualify -- --phase unpack --candidate .artifacts/download/build.tgz --output .artifacts/candidate
      - run: npm run qualify -- --phase test --candidate .artifacts/candidate --group release --engines ${{ matrix.engines }} --output .artifacts/reports/${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: 'reports-${{ matrix.name }}', path: '.artifacts/reports/${{ matrix.name }}', if-no-files-found: error}
  assemble:
    needs: [build, legacy, browsers]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      candidate_id: ${{ steps.upload.outputs.artifact-id }}
      candidate_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: '${{ needs.build.outputs.build_id }}', path: .artifacts/download, skip-decompress: true, digest-mismatch: error}
      - run: npm run qualify -- --phase unpack --candidate .artifacts/download/build.tgz --output .artifacts/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: reports-*, path: .artifacts/download-reports, digest-mismatch: error}
      - run: npm run qualify -- --phase assemble --candidate .artifacts/candidate --reports .artifacts/download-reports/reports-build/infrastructure,.artifacts/download-reports/reports-build/static,.artifacts/download-reports/reports-legacy,.artifacts/download-reports/reports-linux,.artifacts/download-reports/reports-mac
      - run: npm run qualify -- --phase pack --candidate .artifacts/candidate --output .artifacts/candidate.tgz
      - id: retention
        run: node -e "const fs=require('node:fs');const n=Number(process.env.GITHUB_RETENTION_DAYS);if(!Number.isSafeInteger(n)||n<1)process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,'days='+Math.min(30,n)+'\n')"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {path: .artifacts/candidate.tgz, archive: false, if-no-files-found: error, retention-days: '${{ steps.retention.outputs.days }}'}
